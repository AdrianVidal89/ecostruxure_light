{% load core_extras %}
<div class="space-y-3">
  <div>
    {% if document.is_locked_section %}
      <p class="text-xs uppercase tracking-wide text-ink-muted flex items-center gap-1">
        <i data-lucide="lock" class="w-3.5 h-3.5"></i> Auto-filled — not editable here
      </p>
    {% endif %}
    <h3 class="text-lg font-semibold text-ink">{{ document.title }}</h3>
  </div>
  {% if document.guidance %}
    <div class="text-xs text-ink-muted prose prose-sm max-w-none">{{ document.guidance|markdownify }}</div>
  {% endif %}
  <div class="prose prose-sm max-w-none text-ink border-t border-line pt-3">
    {{ document.content|markdownify|default:"<em>Empty</em>" }}
  </div>
</div>
