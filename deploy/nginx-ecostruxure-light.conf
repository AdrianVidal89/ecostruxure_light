# Nginx reverse proxy for EcoStruxure Light.
# Install on each VM:
#   sudo cp deploy/nginx-ecostruxure-light.conf /etc/nginx/sites-available/ecostruxure-light
#   sudo ln -s /etc/nginx/sites-available/ecostruxure-light /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # remove the welcome page
#   sudo nginx -t                                    # must say "syntax is ok"
#   sudo systemctl restart nginx
#
# Set server_name to THIS VM's IP:  PRD = 10.144.15.61 · PPRD = 10.144.72.20

server {
    listen 80;
    server_name 10.144.15.61;

    # Reports, .docx templates and evidence files can be a few MB.
    client_max_body_size 25M;

    location = /favicon.ico { access_log off; log_not_found off; }

    # collectstatic target (WhiteNoise also serves these, but Nginx is faster).
    location /static/ {
        alias /home/OSPUser/EcostruxureLight/staticfiles/;
        access_log off;
        expires 30d;
    }

    # User uploads (evidence, report templates, branding logo). WhiteNoise does
    # NOT serve MEDIA — Nginx must.
    location /media/ {
        alias /home/OSPUser/EcostruxureLight/media/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/home/OSPUser/EcostruxureLight/app.sock;
    }
}

# --- When you move to HTTPS later -------------------------------------------
# Add a `listen 443 ssl;` server block with your certificate, redirect 80→443,
# then in the VM's .env set SECURE_SSL_REDIRECT=True, SESSION_COOKIE_SECURE=True,
# CSRF_COOKIE_SECURE=True, SECURE_HSTS_SECONDS=2592000 and
# CSRF_TRUSTED_ORIGINS=https://<host>, and restart the app.
